<header>Breheny &amp; Huang (2011)  MCP</header>

<p>COORDINATE DESCENT ALGORITHMS FOR NONCONVEX PENALIZED REGRESSION, WITH APPLICATIONS TO BIOLOGICAL FEATURE SELECTION</p>
<p>通常の回帰係数にMCP・SCADを課し、座標降下法（coordinate descent）で推定する</p>
<ul>
<li>MCPには一変量の閉形式解があり、座標ごとの更新を高速に計算できる</li>
<li>Lassoと異なり、 非凸罰則であるため解の不安定性が生じ得る。</li>
</ul>
<p>本研究では論文のMCPを回帰係数へ適用せず、<br />
